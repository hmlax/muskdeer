name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Install pinned generators
        run: make tools
      - name: Verify generated code, lint, unit tests and build
        run: make verify
      - name: Verify isolated infrastructure contracts
        run: make integration
      - name: Verify persistent development resources
        run: make dev-test

name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Install pinned generators
        run: make tools
      - name: Build and verify pinned administration assets
        run: make web-install web-check web-generated-check
      - name: Verify generated code, lint, unit tests and build
        run: make verify
      - name: Verify isolated infrastructure contracts
        run: make integration
      - name: Verify actual administration browser workflow
        run: make admin-browser
      - name: Verify actual strategy administration browser workflow
        run: make admin-strategy-browser
      - name: Verify actual funded control browser workflow
        run: make admin-control-browser
      - name: Verify actual strategy creation browser workflow
        run: make admin-creation-browser
      - name: Verify actual configuration publication browser workflow
        run: make admin-publication-browser
      - name: Verify actual audit history browser workflow
        run: make admin-audit-browser
      - name: Verify actual funded strategy risk browser workflow
        run: make admin-risk-browser
      - name: Verify actual funded order query browser workflow
        run: make admin-orders-browser
      - name: Verify actual funded order cancellation browser workflow
        run: make admin-cancellation-browser
      - name: Verify persistent development resources
        run: make dev-test
      - name: Build pinned toolchain image and verify runtime
        run: make image-test

name: muskdeer

x-runtime: &runtime
  restart: unless-stopped
  user: "${MUSKDEER_UID:?run scripts/compose.py prepare}:${MUSKDEER_GID:?run scripts/compose.py prepare}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 384m
  cpus: 1.0
  stop_grace_period: 15s
  env_file:
    - "${MUSKDEER_RUNTIME_DIR:?run scripts/compose.py prepare}/secrets.env"
    - "${MUSKDEER_RUNTIME_DIR}/nacos.env"
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  tools:
    <<: *runtime
    profiles: [tools]
    image: muskdeer-execution:infra-local
    restart: "no"
    environment:
      NACOS_DATA_ID: execution.json
    volumes:
      - type: bind
        source: "${MUSKDEER_RUNTIME_DIR}/config/execution/certs"
        target: /app/config/certs
        read_only: true
    networks: [infra]
  market:
    <<: *runtime
    image: muskdeer-market:infra-local
    build:
      context: "${MUSKDEER_BUILD_CONTEXT:-.}"
      target: runtime-market
    environment:
      NACOS_DATA_ID: market.json
    volumes:
      - type: bind
        source: "${MUSKDEER_RUNTIME_DIR}/config/market/certs"
        target: /app/config/certs
        read_only: true
    ports: ["127.0.0.1:59002:59002"]
    networks:
      infra: {}
      app:
        ipv4_address: 172.31.240.10
    healthcheck:
      test: [CMD, /readycheck]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 15s
  strategy:
    <<: *runtime
    image: muskdeer-strategy:infra-local
    build:
      context: "${MUSKDEER_BUILD_CONTEXT:-.}"
      target: runtime-strategy
    environment:
      NACOS_DATA_ID: strategy.json
    volumes:
      - type: bind
        source: "${MUSKDEER_RUNTIME_DIR}/config/strategy/certs"
        target: /app/config/certs
        read_only: true
    ports: ["127.0.0.1:59003:59003"]
    networks:
      infra: {}
      app:
        ipv4_address: 172.31.240.11
    healthcheck:
      test: [CMD, /readycheck]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 15s
    depends_on:
      execution:
        condition: service_healthy
      market:
        condition: service_healthy
  execution:
    <<: *runtime
    image: muskdeer-execution:infra-local
    build:
      context: "${MUSKDEER_BUILD_CONTEXT:-.}"
      target: runtime-execution
    environment:
      NACOS_DATA_ID: execution.json
      MUSKDEER_HIMALAYA_TOKEN: "${MUSKDEER_HIMALAYA_TOKEN:-}"
    volumes:
      - type: bind
        source: "${MUSKDEER_RUNTIME_DIR}/config/execution/certs"
        target: /app/config/certs
        read_only: true
    ports: ["127.0.0.1:59004:59004"]
    networks:
      infra: {}
      app:
        ipv4_address: 172.31.240.12
    healthcheck:
      test: [CMD, /readycheck]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 15s
  portfolio:
    <<: *runtime
    image: muskdeer-portfolio:infra-local
    build:
      context: "${MUSKDEER_BUILD_CONTEXT:-.}"
      target: runtime-portfolio
    environment:
      NACOS_DATA_ID: portfolio.json
    volumes:
      - type: bind
        source: "${MUSKDEER_RUNTIME_DIR}/config/portfolio/certs"
        target: /app/config/certs
        read_only: true
    ports: ["127.0.0.1:59005:59005"]
    networks:
      infra: {}
      app:
        ipv4_address: 172.31.240.13
    healthcheck:
      test: [CMD, /readycheck]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 15s
    depends_on:
      execution:
        condition: service_healthy

networks:
  infra:
    external: true
    name: "${MUSKDEER_INFRA_NETWORK:-infra-network}"
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24

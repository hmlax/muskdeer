[package]
name = "muskdeer-himalaya-journal-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.dev]
debug = "line-tables-only"
incremental = false

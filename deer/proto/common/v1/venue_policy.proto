syntax = "proto3";

package muskdeer.common.v1;

import "google/protobuf/duration.proto";
import "deer/proto/common/config/v1/config.proto";

option go_package = "github.com/hmlax/muskdeer/deer/pb/common/v1;commonv1";

// VenuePolicy is an immutable startup/audit snapshot, not a Nacos schema.
// Startup policy is recorded independently of transport connection ownership.
message VenuePolicy {
  string target = 1;
  string token_env = 2;
  repeated VenueProfilePolicy profiles = 3;
  string quantity_fraction = 4;
  uint32 depth = 5;
  google.protobuf.Duration lease_ttl = 6;
  muskdeer.config.v1.SyntheticTape synthetic_tape = 7;
  // Set only for a migrated run with existing consumed slots.
  string synthetic_policy_digest = 8;
}

// VenueProfilePolicy projects business fields from the generated budget
// model. Dynamic balances, reservations and timestamps never enter its digest.
message VenueProfilePolicy {
  int64 user_id = 1;
  int64 fund_id = 2;
  string symbol = 3;
  string maximum_notional = 4;
  string maximum_order_notional = 5;
  uint32 leverage = 6;
  string market_data_source = 7;
  string price_tick = 8;
  string quantity_step = 9;
  int64 strategy_instance_id = 10;
}

// VenueProfileImport is an explicit maintenance input, never service config.
message VenueProfileImport {
  repeated VenueProfilePolicy profiles = 1;
}

// VenueStrategyImport is explicit offline maintenance input, never Nacos data.
message VenueStrategyImport {
  repeated VenueStrategyInput strategies = 1;
}

message VenueStrategyInput {
  VenueProfilePolicy profile = 1;
  muskdeer.config.v1.BusinessRuntime parameters = 2;
  string base_asset = 3;
  string quote_asset = 4;
  string minimum_notional = 5;
  int64 expected_revision = 6;
}

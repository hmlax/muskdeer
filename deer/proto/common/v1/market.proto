syntax = "proto3";

package muskdeer.common.v1;

option go_package = "github.com/hmlax/muskdeer/deer/proto/common/v1;commonv1";

// MarketPolicy has explicit millisecond durations and decimal BPS strings.
message MarketPolicy {
  int64 maximum_age_ms = 1;
  int64 maximum_skew_ms = 2;
  string maximum_spread_bps = 3;
  string maximum_jump_bps = 4;
  int32 recovery_samples = 5;
  int64 recovery_window_ms = 6;
}

syntax = "proto3";
package muskdeer.common.v1;
option go_package = "github.com/hmlax/muskdeer/deer/pb/common/v1;commonv1";
import "deer/proto/common/v1/venue.proto";

// SyntheticTapePlan identifies one slot of a finite development market-data run.
// The same run/symbol/sequence never emits again, even if a reply is lost.
message SyntheticTapePlan {
  string run_id = 1;
  string symbol = 2;
  uint32 sequence = 3;
  string side = 4;
  string price = 5;
  string quantity = 6;
  VenueAuthority strategy = 7;
  VenueBook book = 8;
  VenueTrade source_trade = 9;
}
message SyntheticTapeResult {
  string state = 1;
  string trade_id = 2;
  string price = 3;
  string quantity = 4;
  uint64 timestamp_ms = 5;
  bool replayed = 6;
  VenueTrade source_trade = 7;
}

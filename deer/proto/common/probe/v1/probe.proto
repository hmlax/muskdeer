syntax = "proto3";

package muskdeer.probe.v1;

import "tagger/tagger.proto";

option go_package = "github.com/hmlax/muskdeer/deer/pb/common/probe/v1;probev1";

// ArithmeticProbe checks the transport stack before business services.
service ArithmeticProbe {
  rpc Multiply(MultiplyRequest) returns (MultiplyReply);
}

message MultiplyRequest {
  string price = 1 [(tagger.tags) = "query:\"price\""];
  string quantity = 2 [(tagger.tags) = "query:\"quantity\""];
}

message MultiplyReply {
  string notional = 1;
}

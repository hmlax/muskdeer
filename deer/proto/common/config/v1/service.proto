syntax = "proto3";

package muskdeer.config.v1;

import "deer/proto/common/config/v1/data.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/hmlax/muskdeer/deer/proto/common/config/v1;configv1";

// ServiceSettings is service.yaml: identity, listeners and transport lifecycle.
// data_sha256 binds the exact data.yaml bytes; mixed publications fail closed.
message ServiceSettings {
  string name = 1;
  string instance_id = 2;
  string version = 3;
  google.protobuf.Duration startup_timeout = 4;
  google.protobuf.Duration shutdown_timeout = 5;
  Listener grpc = 6;
  Listener http = 7;
  Logging logging = 8;
  NacosRegistration registration = 12;
  GRPCServerSecurity grpc_security = 13;
  GRPCClients grpc_clients = 14;
  Listener monitoring = 15;
  AdminHTTP admin_http = 17;
  string data_sha256 = 18;
}

// ServiceConfig is the composed in-memory Deer snapshot, never a source document.
message ServiceConfig {
  string name = 1;
  string instance_id = 2;
  string version = 3;
  google.protobuf.Duration startup_timeout = 4;
  google.protobuf.Duration shutdown_timeout = 5;
  Listener grpc = 6;
  Listener http = 7;
  Logging logging = 8;
  Postgres postgres = 9;
  Redis redis = 10;
  JetStream jetstream = 11;
  Nacos nacos = 12;
  GRPCServerSecurity grpc_security = 13;
  GRPCClients grpc_clients = 14;
  // Monitoring is a separate, loopback-only Hertz listener for local probes.
  Listener monitoring = 15;
  // Explicit L1 business opt-in; omitted configurations remain infrastructure probes.
  BusinessRuntime business = 16;
  // Explicit management HTTP opt-in. No identity is provisioned at startup.
  AdminHTTP admin_http = 17;
}

// AdminHTTP pins the browser origin independently of request/proxy headers.
message AdminHTTP {
  bool enabled = 1;
  string public_origin = 2;
  // Only literal loopback HTTP is accepted; HTTPS remains the normal mode.
  bool allow_insecure_loopback = 3;
  // Explicitly route read-only strategy management to its owned gRPC client.
  bool strategy_queries_enabled = 4;
  // Separate opt-in for management writes/results; requires strategy queries.
  bool strategy_controls_enabled = 5;
  // Local Docker only: permit 0.0.0.0 with a fixed literal-loopback HTTP
  // public_origin. The published host port must bind to 127.0.0.1.
  bool allow_container_listener = 6;
}

// GRPCClients bounds outbound unary RPCs, including discovery and connection.
message GRPCClients {
  MutualTLS mtls = 1;
  google.protobuf.Duration connect_timeout = 2;
  google.protobuf.Duration request_timeout = 3;
  int32 max_inflight = 4;
  int32 max_request_bytes = 5;
  int32 max_response_bytes = 6;
  repeated string allowed_services = 7;
}

// MutualTLS references PEM files provisioned independently of public config.
message MutualTLS {
  string certificate_file = 1;
  string private_key_file = 2;
  string root_cert_file = 3;
}

// GRPCServerSecurity authenticates callers by CA-verified service DNS SAN.
message GRPCServerSecurity {
  MutualTLS mtls = 1;
  repeated string allowed_peer_services = 2;
}

// Nacos scopes naming requests to one explicitly provisioned environment.
message Nacos {
  string address = 1;
  string namespace_id = 2;
  string group = 3;
  string cluster = 4;
  string username = 5;
  string password_env = 6;
  google.protobuf.Duration connect_timeout = 7;
  google.protobuf.Duration command_timeout = 8;
  optional bool tls_enabled = 9;
  string root_cert_file = 10;
  int32 max_inflight = 11;
  NacosRegistration registration = 12;
}

// NacosRegistration opts a gRPC service into ephemeral instance publication.
message NacosRegistration {
  string advertise_ip = 1;
  google.protobuf.Duration heartbeat_interval = 2;
}

// Logging is immutable after construction; omitted logging defaults to stdout INFO.
message Logging {
  string level = 1;
  bool stdout = 2;
  LogFile file = 3;
}

// LogFile.filename is a base path; service name and instance ID are appended.
message LogFile {
  string filename = 1;
  int32 max_size_mb = 2;
  int32 max_backups = 3;
  int32 max_age_days = 4;
  bool compress = 5;
}

// Listener is optional; when present, address and positive timeouts are required.
// Port zero is useful for isolated tests. Public deployment requires explicit ports.
message Listener {
  string address = 1;
  google.protobuf.Duration request_timeout = 2;
}

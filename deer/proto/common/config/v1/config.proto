syntax = "proto3";

package muskdeer.config.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/hmlax/muskdeer/deer/pb/common/config/v1;configv1";

// Shared configuration definitions for all Muskdeer services.
// Source documents remain separate data.yaml and service.yaml pairs.

// DataConfig is data.yaml: infrastructure and venue transport connections only.
message DataConfig {
 string name = 1;
 string version = 2;
 Postgres postgres = 9;
 Redis redis = 10;
 JetStream jetstream = 11;
 reserved 16;
 reserved "business";
 VenueConnection venue_connection = 18;
}

// BusinessRuntime is loaded from the database after infrastructure is ready.
// It is not part of either Nacos document and never provisions resources.
message BusinessRuntime {
  bool enabled = 1;
  string execution_venue = 2;
  google.protobuf.Duration poll_interval = 3;
  google.protobuf.Duration operation_timeout = 4;
  string portfolio_consumer = 5;
  MarketRuntime market = 6;
  RiskRuntime risk = 7;
  google.protobuf.Duration execution_lease_ttl = 8;
  SimulatorScenarioRuntime simulator = 9;
  StrategyRuntime strategy = 10;
  VenueRuntime venue = 11;
}

// VenueRuntime contains database-owned strategy execution controls.
// Gateway transport is configured separately in VenueConnection.
message VenueRuntime {
  reserved 1, 2;
  reserved "target", "token_env";
  // Account/product/risk policy is loaded from PostgreSQL, never Nacos.
  reserved 3;
  reserved "profiles";
  string quantity_fraction = 4;
  uint32 depth = 5;
  google.protobuf.Duration lease_ttl = 6;
  SyntheticTape synthetic_tape = 7;
  string replacement_fraction = 8;
  uint32 bridge_slots = 9;
  repeated string symbols = 10;
}

// SyntheticTape is an opt-in development market-data run; it never places orders.
message SyntheticTape {
  bool enabled = 1;
  bool development_only = 2;
  string run_id = 3;
  google.protobuf.Duration interval = 4;
  // Zero disables the cumulative event-count limit.
  uint32 maximum_events = 5;
  repeated SyntheticTapeProfile profiles = 6;
  SyntheticTapeMode mode = 7;
}

enum SyntheticTapeMode {
  SYNTHETIC_TAPE_MODE_BOOK = 0;
  SYNTHETIC_TAPE_MODE_AGG_TRADE = 1;
}

message SyntheticTapeProfile {
  string symbol = 1;
  // Fixed size in BOOK mode; single-event quantity cap in AGG_TRADE mode.
  string quantity = 2;
  // Decimal zero disables the cumulative notional limit.
  string maximum_notional = 3;
}

// JetStream owns a synchronous publisher to a pre-provisioned stream.
// address is TCP host:port, without a URL or embedded credentials.
message JetStream {
  string address = 1;
  string stream = 2;
  string subject_prefix = 3;
  string token_env = 4;
  google.protobuf.Duration connect_timeout = 5;
  google.protobuf.Duration command_timeout = 6;
  int32 max_inflight = 7;
  int32 max_message_bytes = 8;
  optional bool tls_enabled = 9;
  string root_cert_file = 10;
  // Use either token_env or username/password_env, never both.
  string username = 11;
  string password_env = 12;
}

// Redis is a standalone, namespaced cache. Monetary authority remains in PostgreSQL.
message Redis {
  string address = 1;
  int32 database = 2;
  string username = 3;
  string password_env = 4;
  string key_prefix = 5;
  int32 pool_size = 6;
  google.protobuf.Duration connect_timeout = 7;
  google.protobuf.Duration command_timeout = 8;
  google.protobuf.Duration pool_timeout = 9;
  google.protobuf.Duration max_idle_time = 10;
  google.protobuf.Duration max_lifetime = 11;
  optional bool tls_enabled = 12;
  string root_cert_file = 13;
}

// Postgres is optional; when present, initialization and readiness require it.
// password_env names an environment variable rather than storing its value here.
message Postgres {
  string host = 1;
  uint32 port = 2;
  string database = 3;
  string username = 4;
  string password_env = 5;
  string ssl_mode = 6;
  string root_cert_file = 7;
  string schema = 8;
  int32 max_open_conns = 9;
  int32 max_idle_conns = 10;
  google.protobuf.Duration max_lifetime = 11;
  google.protobuf.Duration max_idle_time = 12;
  google.protobuf.Duration connect_timeout = 13;
  google.protobuf.Duration statement_timeout = 14;
}

// ServiceSettings is service.yaml: identity, listeners and transport lifecycle.
// data_sha256 binds the exact data.yaml bytes; mixed publications fail closed.
message ServiceSettings {
  string name = 1;
  string instance_id = 2;
  string version = 3;
  google.protobuf.Duration startup_timeout = 4;
  google.protobuf.Duration shutdown_timeout = 5;
  Listener grpc = 6;
  Listener http = 7;
  Logging logging = 8;
  NacosRegistration registration = 12;
  GRPCServerSecurity grpc_security = 13;
  GRPCClients grpc_clients = 14;
  Listener monitoring = 15;
  AdminHTTP admin_http = 17;
  string data_sha256 = 18;
  Tracing tracing = 19;
}

// ServiceConfig is the composed in-memory Deer snapshot, never a source document.
message ServiceConfig {
  string name = 1;
  string instance_id = 2;
  string version = 3;
  google.protobuf.Duration startup_timeout = 4;
  google.protobuf.Duration shutdown_timeout = 5;
  Listener grpc = 6;
  Listener http = 7;
  Logging logging = 8;
  Postgres postgres = 9;
  Redis redis = 10;
  JetStream jetstream = 11;
  Nacos nacos = 12;
  GRPCServerSecurity grpc_security = 13;
  GRPCClients grpc_clients = 14;
  // Monitoring is a separate, loopback-only Hertz listener for local probes.
  Listener monitoring = 15;
  // Internal database-resolved snapshot; never published to Nacos.
  BusinessRuntime business = 16;
  // Explicit management HTTP opt-in. No identity is provisioned at startup.
  AdminHTTP admin_http = 17;
  VenueConnection venue_connection = 18;
  Tracing tracing = 19;
}

// AdminHTTP pins the browser origin independently of request/proxy headers.
message AdminHTTP {
  bool enabled = 1;
  string public_origin = 2;
  // Only literal loopback HTTP is accepted; HTTPS remains the normal mode.
  bool allow_insecure_loopback = 3;
  // Explicitly route read-only strategy management to its owned gRPC client.
  bool strategy_queries_enabled = 4;
  // Separate opt-in for management writes/results; requires strategy queries.
  bool strategy_controls_enabled = 5;
  // Local Docker only: permit 0.0.0.0 with a fixed literal-loopback HTTP
  // public_origin. The published host port must bind to 127.0.0.1.
  bool allow_container_listener = 6;
}

// GRPCClients bounds outbound unary RPCs, including discovery and connection.
message GRPCClients {
  MutualTLS mtls = 1;
  google.protobuf.Duration connect_timeout = 2;
  google.protobuf.Duration request_timeout = 3;
  int32 max_inflight = 4;
  int32 max_request_bytes = 5;
  int32 max_response_bytes = 6;
  repeated string allowed_services = 7;
}

// MutualTLS references PEM files provisioned independently of public config.
message MutualTLS {
  string certificate_file = 1;
  string private_key_file = 2;
  string root_cert_file = 3;
}

// GRPCServerSecurity authenticates callers by CA-verified service DNS SAN.
message GRPCServerSecurity {
  MutualTLS mtls = 1;
  repeated string allowed_peer_services = 2;
}

// Nacos scopes naming requests to one explicitly provisioned environment.
message Nacos {
  string address = 1;
  string namespace_id = 2;
  string group = 3;
  string cluster = 4;
  string username = 5;
  string password_env = 6;
  google.protobuf.Duration connect_timeout = 7;
  google.protobuf.Duration command_timeout = 8;
  optional bool tls_enabled = 9;
  string root_cert_file = 10;
  int32 max_inflight = 11;
  NacosRegistration registration = 12;
}

// NacosRegistration opts a gRPC service into ephemeral instance publication.
message NacosRegistration {
  string advertise_ip = 1;
  google.protobuf.Duration heartbeat_interval = 2;
}

// Logging is immutable after construction; omitted logging defaults to stdout INFO.
message Logging {
  string level = 1;
  bool stdout = 2;
  LogFile file = 3;
}

// LogFile.filename is a base path; service name and instance ID are appended.
message LogFile {
  string filename = 1;
  int32 max_size_mb = 2;
  int32 max_backups = 3;
  int32 max_age_days = 4;
  bool compress = 5;
}

// Listener is optional; when present, address and positive timeouts are required.
// Port zero is useful for isolated tests. Public deployment requires explicit ports.
message Listener {
  string address = 1;
  google.protobuf.Duration request_timeout = 2;
}

// MarketRuntime binds existing immutable feeds; it never provisions products.
message MarketRuntime {
  repeated MarketFeedRuntime feeds = 1;
  google.protobuf.Duration lease_ttl = 2;
}

// MarketFeedRuntime requires explicit values only for a REPLAY database binding.
// A LIVE binding rejects all replay inputs and uses fixed public TLS endpoints.
message MarketFeedRuntime {
  int64 feed_id = 1;
  string replay_bid = 2;
  string replay_ask = 3;
  string replay_quantity = 4;
  google.protobuf.Duration replay_interval = 5;
}

// StrategyRuntime discovers existing instances only in explicitly owned accounts.
message StrategyRuntime {
  repeated string account_ids = 1;
  google.protobuf.Duration lease_ttl = 2;
  // May serve management reads without any account workers or outbound clients.
  bool management_enabled = 3;
  // Registers operator controls and a result-only observer; grants no trading resources.
  bool control_enabled = 4;
}

// SimulatorScenarioRuntime explicitly enables privileged L1 venue responses.
message SimulatorScenarioRuntime {
  repeated string account_ids = 1;
  google.protobuf.Duration cancel_delay = 2;
}

// RiskRuntime grants no resources; it limits evaluation to existing accounts.
message RiskRuntime {
  repeated string account_ids = 1;
}

// VenueConnection contains transport setup only. Credentials remain in env.
message VenueConnection {
  string target = 1;
  string token_env = 2;
}

// RuntimePolicyImport is explicit maintenance input, never a Nacos document.
message RuntimePolicyImport { repeated RuntimePolicyInput policies = 1; }
message RuntimePolicyInput {
  string service_name = 1;
  int64 expected_revision = 2;
  BusinessRuntime parameters = 3;
}

// Tracing exports bounded asynchronous OTLP/gRPC spans; env only bootstraps Nacos.
message Tracing {
 bool enabled = 1;
 string endpoint = 2;
 bool insecure = 3;
 string root_cert_file = 4;
 uint32 sampling_per_million = 5;
 google.protobuf.Duration export_timeout = 6;
}

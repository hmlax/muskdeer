syntax = "proto3";

package muskdeer.config.v1;

import "deer/proto/execution/config/v1/execution.proto";
import "deer/proto/market/config/v1/market.proto";
import "deer/proto/strategy/config/v1/strategy.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/hmlax/muskdeer/deer/proto/common/config/v1;configv1";

// DataConfig is data.yaml: connections and business runtime controls.
message DataConfig {
 string name = 1;
 string version = 2;
 Postgres postgres = 9;
 Redis redis = 10;
 JetStream jetstream = 11;
 BusinessRuntime business = 16;
}

// BusinessRuntime configures owned business work without migrating
// schemas, provisioning broker resources, seeding money or authorizing risk.
message BusinessRuntime {
  bool enabled = 1;
  string execution_venue = 2;
  google.protobuf.Duration poll_interval = 3;
  google.protobuf.Duration operation_timeout = 4;
  string portfolio_consumer = 5;
  MarketRuntime market = 6;
  RiskRuntime risk = 7;
  google.protobuf.Duration execution_lease_ttl = 8;
  SimulatorScenarioRuntime simulator = 9;
  StrategyRuntime strategy = 10;
  HimalayaRuntime himalaya = 11;
}

// HimalayaRuntime opts into the existing SDK on the development environment.
// Secrets are resolved from env only by the execution worker lifecycle.
message HimalayaRuntime {
  string target = 1;
  string token_env = 2;
  // Account/product/risk policy is loaded from PostgreSQL, never Nacos.
  reserved 3;
  reserved "profiles";
  string quantity_fraction = 4;
  uint32 depth = 5;
  google.protobuf.Duration lease_ttl = 6;
  SyntheticTape synthetic_tape = 7;
}

// SyntheticTape is an opt-in, finite market-data test run; it never places orders.
message SyntheticTape {
  bool enabled = 1;
  bool development_only = 2;
  string run_id = 3;
  google.protobuf.Duration interval = 4;
  uint32 maximum_events = 5;
  repeated SyntheticTapeProfile profiles = 6;
  SyntheticTapeMode mode = 7;
}

enum SyntheticTapeMode {
  SYNTHETIC_TAPE_MODE_BOOK = 0;
  SYNTHETIC_TAPE_MODE_AGG_TRADE = 1;
}

message SyntheticTapeProfile {
  string symbol = 1;
  // Fixed size in BOOK mode; single-event quantity cap in AGG_TRADE mode.
  string quantity = 2;
  string maximum_notional = 3;
}

// JetStream owns a synchronous publisher to a pre-provisioned stream.
// address is TCP host:port, without a URL or embedded credentials.
message JetStream {
  string address = 1;
  string stream = 2;
  string subject_prefix = 3;
  string token_env = 4;
  google.protobuf.Duration connect_timeout = 5;
  google.protobuf.Duration command_timeout = 6;
  int32 max_inflight = 7;
  int32 max_message_bytes = 8;
  optional bool tls_enabled = 9;
  string root_cert_file = 10;
  // Use either token_env or username/password_env, never both.
  string username = 11;
  string password_env = 12;
}

// Redis is a standalone, namespaced cache. Monetary authority remains in PostgreSQL.
message Redis {
  string address = 1;
  int32 database = 2;
  string username = 3;
  string password_env = 4;
  string key_prefix = 5;
  int32 pool_size = 6;
  google.protobuf.Duration connect_timeout = 7;
  google.protobuf.Duration command_timeout = 8;
  google.protobuf.Duration pool_timeout = 9;
  google.protobuf.Duration max_idle_time = 10;
  google.protobuf.Duration max_lifetime = 11;
  optional bool tls_enabled = 12;
  string root_cert_file = 13;
}

// Postgres is optional; when present, initialization and readiness require it.
// password_env names an environment variable rather than storing its value here.
message Postgres {
  string host = 1;
  uint32 port = 2;
  string database = 3;
  string username = 4;
  string password_env = 5;
  string ssl_mode = 6;
  string root_cert_file = 7;
  string schema = 8;
  int32 max_open_conns = 9;
  int32 max_idle_conns = 10;
  google.protobuf.Duration max_lifetime = 11;
  google.protobuf.Duration max_idle_time = 12;
  google.protobuf.Duration connect_timeout = 13;
  google.protobuf.Duration statement_timeout = 14;
}

syntax = "proto3";

package muskdeer.model.v1;

import "tagger/tagger.proto";

option go_package = "github.com/hmlax/muskdeer/deer/proto/strategy/model/v1;modelv1";

// AdminStrategyOperation retains an actor-scoped idempotent control receipt.
// Authentication secrets are never stored here. Terminal observations are immutable.
message AdminStrategyOperation {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  int64 actor_user_id = 5 [(tagger.tags) = "gorm:\"column:actor_user_id;type:bigint;not null;uniqueIndex:uk_admin_strategy_operation_key\""];
  int64 actor_session_id = 6 [(tagger.tags) = "gorm:\"column:actor_session_id;type:bigint;not null\""];
  int64 strategy_instance_id = 7 [(tagger.tags) = "gorm:\"column:strategy_instance_id;type:bigint;not null;index:idx_admin_strategy_operation_strategy\""];
  int64 audit_id = 8 [(tagger.tags) = "gorm:\"column:audit_id;type:bigint;not null;uniqueIndex:uk_admin_strategy_operation_audit\""];
  string idempotency_key = 9 [(tagger.tags) = "gorm:\"column:idempotency_key;type:varchar(64);not null;uniqueIndex:uk_admin_strategy_operation_key\""];
  string request_fingerprint = 10 [(tagger.tags) = "gorm:\"column:request_fingerprint;type:char(64);not null\""];
  string action = 11 [(tagger.tags) = "gorm:\"column:action;type:varchar(32);not null\""];
  string target_state = 12 [(tagger.tags) = "gorm:\"column:target_state;type:varchar(16);not null\""];
  int64 expected_revision = 13 [(tagger.tags) = "gorm:\"column:expected_revision;type:bigint;not null\""];
  int64 effect_revision = 14 [(tagger.tags) = "gorm:\"column:effect_revision;type:bigint;not null\""];
  int64 config_version = 15 [(tagger.tags) = "gorm:\"column:config_version;type:bigint;not null\""];
  string market_data_source = 16 [(tagger.tags) = "gorm:\"column:market_data_source;type:varchar(32);not null\""];
  string reason = 17 [(tagger.tags) = "gorm:\"column:reason;type:varchar(256);not null\""];
  string state = 18 [(tagger.tags) = "gorm:\"column:state;type:varchar(16);not null;index:idx_admin_strategy_operation_pending\""];
  string outcome_code = 19 [(tagger.tags) = "gorm:\"column:outcome_code;type:varchar(32);not null\""];
  int64 revision = 20 [(tagger.tags) = "gorm:\"column:revision;type:bigint;not null\""];
  optional int64 completed_at = 21 [(tagger.tags) = "gorm:\"column:completed_at;type:bigint\""];
  optional int64 observed_revision = 22 [(tagger.tags) = "gorm:\"column:observed_revision;type:bigint\""];
  optional string observed_state = 23 [(tagger.tags) = "gorm:\"column:observed_state;type:varchar(32)\""];
  optional string observed_owner_id = 24 [(tagger.tags) = "gorm:\"column:observed_owner_id;type:varchar(128)\""];
  optional int64 observed_owner_epoch = 25 [(tagger.tags) = "gorm:\"column:observed_owner_epoch;type:bigint\""];
}

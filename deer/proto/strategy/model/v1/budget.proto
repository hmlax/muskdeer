syntax = "proto3";

package muskdeer.model.v1;

import "tagger/tagger.proto";

option go_package = "github.com/hmlax/muskdeer/deer/proto/strategy/model/v1;modelv1";

// StrategyBudget is subordinate to the shared account budget.
message StrategyBudget {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  int64 strategy_instance_id = 5 [(tagger.tags) = "gorm:\"column:strategy_instance_id;type:bigint;not null;uniqueIndex:uk_strategy_budget_instance\""];
  string account_id = 6 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null\""];
  string limit_notional = 7 [(tagger.tags) = "gorm:\"column:limit_notional;type:numeric(76,36);not null\""];
  string reserved_notional = 8 [(tagger.tags) = "gorm:\"column:reserved_notional;type:numeric(76,36);not null\""];
  bool enabled = 9 [(tagger.tags) = "gorm:\"column:enabled;type:boolean;not null\""];
  int64 revision = 10 [(tagger.tags) = "gorm:\"column:revision;type:bigint;not null\""];
}

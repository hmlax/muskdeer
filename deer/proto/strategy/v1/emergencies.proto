syntax = "proto3";

package muskdeer.strategy.v1;

option go_package = "github.com/hmlax/muskdeer/deer/proto/strategy/v1;strategyv1";

import "deer/proto/strategy/v1/management.proto";

// Query reads current-viewer snapshots without advancing the durable task.
service StrategyEmergencyCancellationQuery {
  rpc GetEmergencyCancellation(GetEmergencyCancellationRequest) returns (EmergencyCancellationObservation);
  rpc ListEmergencyCancellations(ListEmergencyCancellationsRequest) returns (ListEmergencyCancellationsReply);
}

// Control is available only with explicit management write opt-in.
service StrategyEmergencyCancellationControl {
  rpc RequestEmergencyCancellation(RequestEmergencyCancellationRequest) returns (EmergencyCancellationAcceptance);
}

message EmergencyCancellationInput {
  string scope = 1;
  int64 expected_risk_revision = 2;
  string reason = 3;
}

message RequestEmergencyCancellationRequest {
  AdminSession session = 1;
  string csrf_token = 2;
  string idempotency_key = 3;
  int64 strategy_id = 4;
  EmergencyCancellationInput input = 5;
}

message GetEmergencyCancellationRequest {
  AdminSession session = 1;
  int64 strategy_id = 2;
  int64 cancellation_id = 3;
}

message ListEmergencyCancellationsRequest {
  AdminSession session = 1;
  int64 strategy_id = 2;
  int64 after_id = 3;
  int32 limit = 4;
}

// Immutable acceptance proves risk closure at acceptance, never completion.
message EmergencyCancellationAcceptance {
  int64 id = 1;
  int64 actor_user_id = 2;
  int64 strategy_id = 3;
  string scope = 4;
  int64 expected_risk_revision = 5;
  int64 risk_revision = 6;
  string reason = 7;
  int64 created_at_ms = 8;
}

// Stored task proof remains historical after later order/risk changes.
message EmergencyCancellationRecord {
  EmergencyCancellationAcceptance acceptance = 1;
  string state = 2;
  int64 revision = 3;
  bool enrollment_complete = 4;
  optional int64 completed_at_ms = 5;
}

// Current counters do not derive or overwrite the historical task result.
message EmergencyCancellationProgress {
  int64 targets = 1;
  int64 terminal = 2;
  int64 failed = 3;
  int64 pending_submissions = 4;
  bool enrollment_complete = 5;
}

message EmergencyCancellationObservation {
  EmergencyCancellationRecord record = 1;
  EmergencyCancellationProgress progress = 2;
  int64 observed_at_ms = 3;
}

message ListEmergencyCancellationsReply {
  repeated EmergencyCancellationRecord items = 1;
  int64 next_after_id = 2;
  int64 observed_at_ms = 3;
}

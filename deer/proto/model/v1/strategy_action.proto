  int64 strategy_instance_id = 5 [(tagger.tags) = "gorm:\"column:strategy_instance_id;type:bigint;not null;uniqueIndex:uk_strategy_action_decision\""];
  string decision_key = 6 [(tagger.tags) = "gorm:\"column:decision_key;type:varchar(128);not null;uniqueIndex:uk_strategy_action_decision\""];
  string account_id = 7 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null;uniqueIndex:uk_strategy_action_rpc_key\""];

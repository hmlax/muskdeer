  string idempotency_key = 16 [(tagger.tags) = "gorm:\"column:idempotency_key;type:varchar(128);not null;uniqueIndex:uk_strategy_action_rpc_key\""];
  string client_order_id = 17 [(tagger.tags) = "gorm:\"column:client_order_id;type:varchar(64);not null\""];
  string state = 18 [(tagger.tags) = "gorm:\"column:state;type:varchar(16);not null\""];

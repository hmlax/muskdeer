syntax = "proto3";

package muskdeer.model.v1;

import "tagger/tagger.proto";
import "deer/proto/common/v1/strategy_parameters.proto";

option go_package = "github.com/hmlax/muskdeer/deer/proto/model/v1;modelv1";

// Instrument describes execution metadata independently of market-data source.
message Instrument {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  string execution_venue = 5 [(tagger.tags) = "gorm:\"column:execution_venue;type:varchar(32);not null;uniqueIndex:uk_instrument_venue_symbol\""];
  string symbol = 6 [(tagger.tags) = "gorm:\"column:symbol;type:varchar(64);not null;uniqueIndex:uk_instrument_venue_symbol\""];
  string base_asset = 7 [(tagger.tags) = "gorm:\"column:base_asset;type:varchar(32);not null\""];
  string quote_asset = 8 [(tagger.tags) = "gorm:\"column:quote_asset;type:varchar(32);not null\""];
  // Quote currency per base unit; strictly positive, at most 20+18 digits.
  string price_tick = 9 [(tagger.tags) = "gorm:\"column:price_tick;type:numeric(38,18);not null\""];
  // Base quantity; strictly positive, at most 20+18 digits.
  string quantity_step = 10 [(tagger.tags) = "gorm:\"column:quantity_step;type:numeric(38,18);not null\""];
  // Quote currency; strictly positive, at most 20+18 digits.
  string min_notional = 11 [(tagger.tags) = "gorm:\"column:min_notional;type:numeric(38,18);not null\""];
  string status = 12 [(tagger.tags) = "gorm:\"column:status;type:varchar(16);not null\""];
  int64 metadata_version = 13 [(tagger.tags) = "gorm:\"column:metadata_version;type:bigint;not null\""];
}

// StrategyInstance stores requested configuration independently of active input.
message StrategyInstance {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  string instance_key = 5 [(tagger.tags) = "gorm:\"column:instance_key;type:varchar(64);not null;uniqueIndex:uk_strategy_instance_key\""];
  string template = 6 [(tagger.tags) = "gorm:\"column:template;type:varchar(32);not null\""];
  string account_id = 7 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null;index:idx_strategy_instance_account\""];
  int64 instrument_id = 8 [(tagger.tags) = "gorm:\"column:instrument_id;type:bigint;not null;index:idx_strategy_instance_instrument\""];
  string code_version = 9 [(tagger.tags) = "gorm:\"column:code_version;type:varchar(64);not null\""];
  int64 revision = 10 [(tagger.tags) = "gorm:\"column:revision;type:bigint;not null\""];
  string state = 11 [(tagger.tags) = "gorm:\"column:state;type:varchar(32);not null\""];
  bool desired_running = 12 [(tagger.tags) = "gorm:\"column:desired_running;type:boolean;not null\""];
  int64 requested_config_version = 13 [(tagger.tags) = "gorm:\"column:requested_config_version;type:bigint;not null\""];
  string market_data_source = 14 [(tagger.tags) = "gorm:\"column:market_data_source;type:varchar(32);not null\""];
  optional int64 active_config_version = 15 [(tagger.tags) = "gorm:\"column:active_config_version;type:bigint\""];
  optional string active_market_data_source = 16 [(tagger.tags) = "gorm:\"column:active_market_data_source;type:varchar(32)\""];
  string market_mode = 17 [(tagger.tags) = "gorm:\"column:market_mode;type:varchar(16);not null;default:REPLAY\""];
  string runtime_owner_id = 18 [(tagger.tags) = "gorm:\"column:runtime_owner_id;type:varchar(128);not null;default:''\""];
  int64 runtime_owner_epoch = 19 [(tagger.tags) = "gorm:\"column:runtime_owner_epoch;type:bigint;not null;default:0\""];
  // Durable requested target, independent of runtime recovery/ownership.
  string desired_state = 20 [(tagger.tags) = "gorm:\"column:desired_state;type:varchar(16);not null;default:''\""];
}

// StrategyConfigVersion stores immutable version/source identity and typed
// template parameters. JSONB is a concrete storage boundary, never an untyped
// payload. Schema zero identifies legacy metadata-only versions, not runnable.
message StrategyConfigVersion {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  int64 instance_id = 5 [(tagger.tags) = "gorm:\"column:instance_id;type:bigint;not null;uniqueIndex:uk_strategy_config_instance_version\""];
  int64 version = 6 [(tagger.tags) = "gorm:\"column:version;type:bigint;not null;uniqueIndex:uk_strategy_config_instance_version\""];
  string market_data_source = 7 [(tagger.tags) = "gorm:\"column:market_data_source;type:varchar(32);not null\""];
  string code_version = 8 [(tagger.tags) = "gorm:\"column:code_version;type:varchar(64);not null\""];
  string created_by = 9 [(tagger.tags) = "gorm:\"column:created_by;type:varchar(64);not null\""];
  int64 parameters_schema_version = 10 [(tagger.tags) = "gorm:\"column:parameters_schema_version;type:bigint;not null\""];
  optional string template = 11 [(tagger.tags) = "gorm:\"column:template;type:varchar(32)\""];
  muskdeer.common.v1.MakerParameters maker_parameters = 12 [(tagger.tags) = "gorm:\"column:maker_parameters;type:jsonb;serializer:json\""];
  muskdeer.common.v1.GridParameters grid_parameters = 13 [(tagger.tags) = "gorm:\"column:grid_parameters;type:jsonb;serializer:json\""];
}

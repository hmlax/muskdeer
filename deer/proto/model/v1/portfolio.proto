syntax = "proto3";

package muskdeer.model.v1;

import "tagger/tagger.proto";

option go_package = "github.com/hmlax/muskdeer/deer/proto/model/v1;modelv1";

// PortfolioAccount has an explicit opening anchor and a rebuildable projection.
// The initial MVP binds one instrument per funded account.
message PortfolioAccount {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  string account_id = 5 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null;uniqueIndex:uk_portfolio_account_key\""];
  int64 instrument_id = 6 [(tagger.tags) = "gorm:\"column:instrument_id;type:bigint;not null\""];
  string base_asset = 7 [(tagger.tags) = "gorm:\"column:base_asset;type:varchar(32);not null\""];
  string quote_asset = 8 [(tagger.tags) = "gorm:\"column:quote_asset;type:varchar(32);not null\""];
  string opening_quantity = 9 [(tagger.tags) = "gorm:\"column:opening_quantity;type:numeric(76,36);not null\""];
  string opening_cash_quote = 10 [(tagger.tags) = "gorm:\"column:opening_cash_quote;type:numeric(76,36);not null\""];
  string opening_cost_quote = 11 [(tagger.tags) = "gorm:\"column:opening_cost_quote;type:numeric(76,36);not null\""];
  string quantity = 12 [(tagger.tags) = "gorm:\"column:quantity;type:numeric(76,36);not null\""];
  string cash_quote = 13 [(tagger.tags) = "gorm:\"column:cash_quote;type:numeric(76,36);not null\""];
  string cost_quote = 14 [(tagger.tags) = "gorm:\"column:cost_quote;type:numeric(76,36);not null\""];
  string realized_pnl_quote = 15 [(tagger.tags) = "gorm:\"column:realized_pnl_quote;type:numeric(76,36);not null\""];
  string fees_quote = 16 [(tagger.tags) = "gorm:\"column:fees_quote;type:numeric(76,36);not null\""];
  int64 last_source_sequence = 17 [(tagger.tags) = "gorm:\"column:last_source_sequence;type:bigint;not null\""];
  bool reconciled = 18 [(tagger.tags) = "gorm:\"column:reconciled;type:boolean;not null\""];
  int64 revision = 19 [(tagger.tags) = "gorm:\"column:revision;type:bigint;not null\""];
  string error_code = 20 [(tagger.tags) = "gorm:\"column:error_code;type:varchar(64);not null\""];
}

// PortfolioFill keeps immutable natural trade identity independently of inbox.
message PortfolioFill {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  string execution_venue = 5 [(tagger.tags) = "gorm:\"column:execution_venue;type:varchar(32);not null;uniqueIndex:uk_portfolio_fill_trade;uniqueIndex:uk_portfolio_fill_sequence\""];
  string trade_id = 6 [(tagger.tags) = "gorm:\"column:trade_id;type:varchar(128);not null;uniqueIndex:uk_portfolio_fill_trade\""];
  int64 source_sequence = 7 [(tagger.tags) = "gorm:\"column:source_sequence;type:bigint;not null;uniqueIndex:uk_portfolio_fill_sequence\""];
  int64 intent_id = 8 [(tagger.tags) = "gorm:\"column:intent_id;type:bigint;not null\""];
  int64 core_order_id = 9 [(tagger.tags) = "gorm:\"column:core_order_id;type:bigint;not null\""];
  string account_id = 10 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null;index:idx_portfolio_fill_account_sequence\""];
  int64 strategy_instance_id = 11 [(tagger.tags) = "gorm:\"column:strategy_instance_id;type:bigint;not null\""];
  int64 instrument_id = 12 [(tagger.tags) = "gorm:\"column:instrument_id;type:bigint;not null\""];
  string side = 13 [(tagger.tags) = "gorm:\"column:side;type:varchar(8);not null\""];
  string price = 14 [(tagger.tags) = "gorm:\"column:price;type:numeric(38,18);not null\""];
  string quantity = 15 [(tagger.tags) = "gorm:\"column:quantity;type:numeric(38,18);not null\""];
  string quote_notional = 16 [(tagger.tags) = "gorm:\"column:quote_notional;type:numeric(76,36);not null\""];
  string fee_amount = 17 [(tagger.tags) = "gorm:\"column:fee_amount;type:numeric(76,36);not null\""];
  string fee_asset = 18 [(tagger.tags) = "gorm:\"column:fee_asset;type:varchar(32);not null\""];
}

// ConsumerInbox is committed with consumer effects before broker ACK.
message ConsumerInbox {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  string consumer = 5 [(tagger.tags) = "gorm:\"column:consumer;type:varchar(64);not null;uniqueIndex:uk_inbox_consumer_event\""];
  string event_id = 6 [(tagger.tags) = "gorm:\"column:event_id;type:varchar(128);not null;uniqueIndex:uk_inbox_consumer_event\""];
  string payload_hash = 7 [(tagger.tags) = "gorm:\"column:payload_hash;type:char(64);not null\""];
  int64 processed_at = 8 [(tagger.tags) = "gorm:\"column:processed_at;type:bigint;not null\""];
}

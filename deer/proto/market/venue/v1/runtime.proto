syntax = "proto3";

package muskdeer.market.venue.v1;

import "deer/proto/common/v1/venue.proto";

option go_package = "github.com/hmlax/muskdeer/deer/pb/market/venue/v1;venuev1";

// These are internal Muskdeer contracts, independent of the upstream SDK wire.
service Market {
  rpc DescribeInstances(muskdeer.common.v1.VenueInstanceInventoryRequest) returns (muskdeer.common.v1.VenueInstanceInventory);
  rpc GetBook(BookRequest) returns (muskdeer.common.v1.VenueBook);
  rpc GetTrade(TradeRequest) returns (muskdeer.common.v1.VenueTrade);
}

message BookRequest { string symbol = 1; }

message TradeRequest { string symbol = 1; }

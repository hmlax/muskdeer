syntax = "proto3";

package muskdeer.model.v1;

import "tagger/tagger.proto";

option go_package = "github.com/hmlax/muskdeer/deer/proto/execution/model/v1;modelv1";

// AdminAccountFlatteningTask records pending work and its last claimed owner.
// An ACTIVE marker is neither order permission nor proof of completion.
message AdminAccountFlatteningTask {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  int64 flattening_id = 5 [(tagger.tags) = "gorm:\"column:flattening_id;type:bigint;not null;uniqueIndex:uk_admin_flatten_task_confirmation\""];
  int64 strategy_instance_id = 6 [(tagger.tags) = "gorm:\"column:strategy_instance_id;type:bigint;not null;index:idx_admin_flatten_task_strategy\""];
  string account_id = 7 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null\""];
  int64 instrument_id = 8 [(tagger.tags) = "gorm:\"column:instrument_id;type:bigint;not null\""];
  string state = 9 [(tagger.tags) = "gorm:\"column:state;type:varchar(16);not null\""];
  int64 revision = 10 [(tagger.tags) = "gorm:\"column:revision;type:bigint;not null\""];
  optional string owner_id = 11 [(tagger.tags) = "gorm:\"column:owner_id;type:varchar(128)\""];
  optional int64 owner_epoch = 12 [(tagger.tags) = "gorm:\"column:owner_epoch;type:bigint\""];
  optional int64 claimed_at = 13 [(tagger.tags) = "gorm:\"column:claimed_at;type:bigint\""];
}

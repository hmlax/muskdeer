syntax = "proto3";

package muskdeer.model.v1;

import "deer/proto/common/v1/himalaya.proto";
import "tagger/tagger.proto";

option go_package = "github.com/hmlax/muskdeer/deer/pb/execution/model/v1;modelv1";

// VenueOrderIntent is persisted before dispatch. An ambiguous attempt cannot be
// dispatched again, including after process death or ownership handover.
message VenueOrderIntent {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  string account_id = 5 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null;index:idx_himalaya_intent_account\""];
  int64 user_id = 6 [(tagger.tags) = "gorm:\"column:user_id;type:bigint;not null\""];
  int64 fund_id = 7 [(tagger.tags) = "gorm:\"column:fund_id;type:bigint;not null\""];
  string symbol = 8 [(tagger.tags) = "gorm:\"column:symbol;type:varchar(32);not null\""];
  string client_id = 9 [(tagger.tags) = "gorm:\"column:client_id;type:varchar(128);not null;uniqueIndex:uk_himalaya_intent_client\""];
  string owner_id = 10 [(tagger.tags) = "gorm:\"column:owner_id;type:varchar(128);not null\""];
  int64 owner_epoch = 11 [(tagger.tags) = "gorm:\"column:owner_epoch;type:bigint;not null\""];
  string request_digest = 12 [(tagger.tags) = "gorm:\"column:request_digest;type:varchar(64);not null\""];
  string side = 13 [(tagger.tags) = "gorm:\"column:side;type:varchar(8);not null\""];
  string price = 14 [(tagger.tags) = "gorm:\"column:price;type:numeric(76,36);not null\""];
  string quantity = 15 [(tagger.tags) = "gorm:\"column:quantity;type:numeric(76,36);not null\""];
  uint32 leverage = 16 [(tagger.tags) = "gorm:\"column:leverage;type:integer;not null\""];
  string state = 17 [(tagger.tags) = "gorm:\"column:state;type:varchar(16);not null\""];
  string order_id = 18 [(tagger.tags) = "gorm:\"column:order_id;type:varchar(20);not null\""];
  string reserved_notional = 19 [(tagger.tags) = "gorm:\"column:reserved_notional;type:numeric(76,36);not null\""];
  int64 expires_at = 20 [(tagger.tags) = "gorm:\"column:expires_at;type:bigint;not null\""];
  string strategy_account_id = 21 [(tagger.tags) = "gorm:\"column:strategy_account_id;type:varchar(64);not null\""];
  string strategy_owner_id = 22 [(tagger.tags) = "gorm:\"column:strategy_owner_id;type:varchar(128);not null\""];
  int64 strategy_epoch = 23 [(tagger.tags) = "gorm:\"column:strategy_epoch;type:bigint;not null\""];
  string source_account_id = 24 [(tagger.tags) = "gorm:\"column:source_account_id;type:varchar(64);not null\""];
  string source_owner_id = 25 [(tagger.tags) = "gorm:\"column:source_owner_id;type:varchar(128);not null\""];
  int64 source_epoch = 26 [(tagger.tags) = "gorm:\"column:source_epoch;type:bigint;not null\""];
  int64 source_until = 27 [(tagger.tags) = "gorm:\"column:source_until;type:bigint;not null\""];
  string historical_approval_reference = 28 [(tagger.tags) = "gorm:\"column:historical_approval_reference;type:varchar(256);not null;default:''\""];
  muskdeer.common.v1.HimalayaSnapshot historical_snapshot = 29 [(tagger.tags) = "gorm:\"column:historical_snapshot;type:jsonb;serializer:json\""];
}

// VenueCancellation separates a cancel acknowledgement from terminal proof.
message VenueCancellation {
  int64 id = 1 [(tagger.tags) = "gorm:\"column:id;type:bigint;primaryKey;autoIncrement\""];
  int64 create_at = 2 [(tagger.tags) = "gorm:\"column:create_at;type:bigint;not null;autoCreateTime:milli\""];
  int64 update_at = 3 [(tagger.tags) = "gorm:\"column:update_at;type:bigint;not null;autoUpdateTime:milli\""];
  optional int64 delete_at = 4 [(tagger.tags) = "gorm:\"column:delete_at;type:bigint\""];
  string account_id = 5 [(tagger.tags) = "gorm:\"column:account_id;type:varchar(64);not null;index:idx_himalaya_cancel_account\""];
  int64 user_id = 6 [(tagger.tags) = "gorm:\"column:user_id;type:bigint;not null\""];
  int64 fund_id = 7 [(tagger.tags) = "gorm:\"column:fund_id;type:bigint;not null\""];
  string symbol = 8 [(tagger.tags) = "gorm:\"column:symbol;type:varchar(32);not null\""];
  string order_id = 9 [(tagger.tags) = "gorm:\"column:order_id;type:varchar(20);not null\""];
  string owner_id = 10 [(tagger.tags) = "gorm:\"column:owner_id;type:varchar(128);not null\""];
  int64 owner_epoch = 11 [(tagger.tags) = "gorm:\"column:owner_epoch;type:bigint;not null\""];
  string request_digest = 12 [(tagger.tags) = "gorm:\"column:request_digest;type:varchar(64);not null\""];
  string state = 13 [(tagger.tags) = "gorm:\"column:state;type:varchar(16);not null\""];
}

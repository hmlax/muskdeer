syntax = "proto3";

package muskdeer.execution.venue.v1;

import "deer/proto/common/v1/venue.proto";
import "deer/proto/common/v1/venue_policy.proto";
import "deer/proto/common/v1/synthetic.proto";

option go_package = "github.com/hmlax/muskdeer/deer/pb/execution/venue/v1;venuev1";

service Execution {
  rpc DescribeInstances(muskdeer.common.v1.VenueInstanceInventoryRequest) returns (muskdeer.common.v1.VenueInstanceInventory);
  rpc GetSnapshot(muskdeer.common.v1.VenueScope) returns (muskdeer.common.v1.VenueSnapshot);
  // Read-only enrollment verification, including funds without a strategy yet.
  rpc InspectAccount(muskdeer.common.v1.VenueScope) returns (muskdeer.common.v1.VenueSnapshot);
  rpc DisableAccountPolicy(AccountPolicyDisable) returns (AccountPolicyResult);
  rpc UpdateAccountPolicy(AccountPolicyUpdate) returns (AccountPolicyResult);
  rpc CancelInstanceOrders(CancelInstanceRequest) returns (QuoteResult);
  rpc Reconcile(QuotePlan) returns (QuoteResult);
  // Ephemeral, read-only diagnostics; overflow terminates rather than losing data silently.
  rpc SubscribeQuoteFlows(QuoteFlowRequest) returns (stream QuoteFlow);
  rpc PublishSynthetic(muskdeer.common.v1.SyntheticTapePlan) returns (muskdeer.common.v1.SyntheticTapeResult);
  rpc EvaluateLongGrid(LongGridRequest) returns (LongGridResult);
  rpc GetWashMarket(WashMarketRequest) returns (WashMarketRules);
  rpc WashTrade(WashTradeRequest) returns (muskdeer.common.v1.SyntheticTapeResult);
}

// Current development publication has no local batch or persistence identity.
message WashTradeRequest {
  int64 strategy_instance_id = 1;
  int64 strategy_revision = 2;
  string symbol = 3;
  string side = 4;
  string price = 5;
  string quantity = 6;
  oneof source {
    muskdeer.common.v1.VenueTrade trade = 7;
    muskdeer.common.v1.VenueBook book = 8;
  }
}

message QuotePlan {
  muskdeer.common.v1.VenueScope scope = 1;
  muskdeer.common.v1.VenueBook book = 2;
  muskdeer.common.v1.VenueAuthority strategy = 3;
  repeated muskdeer.common.v1.VenueTarget targets = 4;
  string request_id = 5;
  int64 strategy_instance_id = 6;
  int64 strategy_revision = 7;
  // Diagnostics only: never used for financial admission or freshness.
  int64 proposed_at_unix_nano = 8;
  int64 accepted_at_unix_nano = 9;
}

message QuoteFlowRequest { repeated string symbols = 1; }

// One actual SDK attempt, not a journal or a claim that the order is book-visible.
message QuoteFlow {
  string target_id = 1;
  string client_id = 2;
  string order_id = 3;
  string symbol = 4;
  string side = 5;
  string price = 6;
  int64 source_sequence = 7;
  int64 source_event_at_ms = 8;
  int64 source_received_at_ms = 9;
  int64 source_snapshot_started_at_ms = 10;
  int64 source_valid_until_ms = 11;
  int64 proposed_at_unix_nano = 12;
  int64 accepted_at_unix_nano = 13;
  int64 turn_started_at_unix_nano = 14;
  int64 preparation_wait_nano = 15;
  int64 sdk_started_at_unix_nano = 16;
  int64 sdk_finished_at_unix_nano = 17;
  bool acknowledged = 18;
  string reason = 19;
  int64 strategy_instance_id = 20;
  string source = 21;
  string segment = 22;
}

message QuoteResult {
  uint32 placed = 1;
  uint32 cancelled = 2;
  uint32 retained = 3;
  string state = 4;
}

message CancelInstanceRequest { int64 id = 1; int64 revision = 2; bool cancel_all = 3; }

// Only a fresh market observation is supplied. Execution owns actions and size.
message LongGridRequest {
  int64 strategy_instance_id = 1;
  int64 strategy_revision = 2;
  muskdeer.common.v1.VenueBook book = 3;
}
message LongGridResult {
  string state = 1;
  string action = 2;
  string order_id = 3;
}

// Scope is verified by Console, then serialized with the existing fund writer.
message AccountPolicyUpdate {
 int64 id = 1; int64 expected_updated_at_ms = 2;
 muskdeer.common.v1.VenueScope scope = 3;
 string maximum_notional = 4; string maximum_order_notional = 5; uint32 leverage = 6;
}
message AccountPolicyResult {
 int64 id = 1; int64 updated_at_ms = 2; bool enabled = 3;
 muskdeer.common.v1.VenueProfilePolicy profile = 4;
}

// Current venue trading rules only; no account observation or database work.
message WashMarketRequest {
 int64 strategy_instance_id = 1;
 int64 strategy_revision = 2;
 string symbol = 3;
}
message WashMarketRules {
 muskdeer.common.v1.VenueMarket market = 1;
 int64 valid_until_ms = 2;
}

// An explicit risk-reducing command; existing orders and controls are preserved.
message AccountPolicyDisable {
 int64 id = 1;
 int64 expected_updated_at_ms = 2;
 muskdeer.common.v1.VenueScope scope = 3;
}

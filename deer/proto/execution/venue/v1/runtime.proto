syntax = "proto3";

package muskdeer.execution.venue.v1;

import "deer/proto/common/v1/venue.proto";
import "deer/proto/common/v1/synthetic.proto";

option go_package = "github.com/hmlax/muskdeer/deer/pb/execution/venue/v1;venuev1";

service Execution {
  rpc DescribeInstances(muskdeer.common.v1.VenueInstanceInventoryRequest) returns (muskdeer.common.v1.VenueInstanceInventory);
  rpc GetSnapshot(muskdeer.common.v1.VenueScope) returns (muskdeer.common.v1.VenueSnapshot);
  // Read-only enrollment verification, including funds without a strategy yet.
  rpc InspectAccount(muskdeer.common.v1.VenueScope) returns (muskdeer.common.v1.VenueSnapshot);
  rpc CancelInstanceOrders(CancelInstanceRequest) returns (QuoteResult);
  rpc Reconcile(QuotePlan) returns (QuoteResult);
  rpc PublishSynthetic(muskdeer.common.v1.SyntheticTapePlan) returns (muskdeer.common.v1.SyntheticTapeResult);
  rpc EvaluateLongGrid(LongGridRequest) returns (LongGridResult);
  rpc WashTrade(WashTradeRequest) returns (muskdeer.common.v1.SyntheticTapeResult);
}

// Current development publication has no local batch or persistence identity.
message WashTradeRequest {
  int64 strategy_instance_id = 1;
  int64 strategy_revision = 2;
  string symbol = 3;
  string side = 4;
  string price = 5;
  string quantity = 6;
  oneof source {
    muskdeer.common.v1.VenueTrade trade = 7;
    muskdeer.common.v1.VenueBook book = 8;
  }
}

message QuotePlan {
  muskdeer.common.v1.VenueScope scope = 1;
  muskdeer.common.v1.VenueBook book = 2;
  muskdeer.common.v1.VenueAuthority strategy = 3;
  repeated muskdeer.common.v1.VenueTarget targets = 4;
  string request_id = 5;
  int64 strategy_instance_id = 6;
  int64 strategy_revision = 7;
}

message QuoteResult {
  uint32 placed = 1;
  uint32 cancelled = 2;
  uint32 retained = 3;
  string state = 4;
}

message CancelInstanceRequest { int64 id = 1; int64 revision = 2; bool cancel_all = 3; }

// Only a fresh market observation is supplied. Execution owns actions and size.
message LongGridRequest {
  int64 strategy_instance_id = 1;
  int64 strategy_revision = 2;
  muskdeer.common.v1.VenueBook book = 3;
}
message LongGridResult {
  string state = 1;
  string action = 2;
  string order_id = 3;
}

syntax = "proto3";
package maker_matching;

import "matching.proto";
import "maker_gateway.proto";

// Service-authenticated internal matching boundary. This service does not
// expose account/balance operations and is disabled outside the test profile.
service MatchingAuthority {
  rpc GetStatus(muskdeer.himalaya.v1.CapabilitiesRequest) returns (Status);
  rpc ClaimLease(muskdeer.himalaya.v1.ClaimLeaseRequest) returns (muskdeer.himalaya.v1.Lease);
  rpc RenewLease(muskdeer.himalaya.v1.RenewLeaseRequest) returns (muskdeer.himalaya.v1.Lease);
  rpc ReleaseLease(muskdeer.himalaya.v1.ReleaseLeaseRequest) returns (muskdeer.himalaya.v1.ReleaseLeaseResponse);
  rpc Place(PlaceRequest) returns (matching.PlaceOrderResponse);
}
message Status {
  bool development_test_funds = 1;
  bool durable_authority = 2;
  string incarnation = 3;
}
message PlaceRequest {
  matching.PlaceOrderRequest order = 1;
  muskdeer.himalaya.v1.Proof execution = 2;
  muskdeer.himalaya.v1.Proof strategy = 3;
  uint32 maximum_queue_age_ms = 4;
}

syntax = "proto3";

package muskdeer.strategy.v1;

option go_package = "github.com/hmlax/muskdeer/api/strategy/v1;strategyv1";

import "api/strategy/v1/management.proto";
import "deer/proto/common/v1/strategy_parameters.proto";

// StrategyCreation requires management control opt-in and current operator/CSRF.
service StrategyCreation {
  rpc CreateStrategy(CreateStrategyRequest) returns (CreationReceipt);
}

message CreateStrategyInput {
  string instance_key = 1;
  string account_id = 2;
  int64 instrument_id = 3;
  string code_version = 4;
  string market_data_source = 5;
  string market_mode = 6;
  muskdeer.common.v1.StrategyParameters parameters = 7;
  string reason = 8;
}

message CreateStrategyRequest {
  AdminSession session = 1;
  string csrf_token = 2;
  string idempotency_key = 3;
  CreateStrategyInput input = 4;
}

// CreationReceipt proves metadata creation, never a RUNNING state or risk grant.
message CreationReceipt {
  int64 id = 1;
  int64 actor_user_id = 2;
  int64 strategy_id = 3;
  int64 config_version = 4;
  int64 revision = 5;
  string market_data_source = 6;
  string reason = 7;
  int64 created_at_ms = 8;
}
